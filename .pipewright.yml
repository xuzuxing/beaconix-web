version: 1
stages:
  - id: stg_src
    name: 流水线源
    kind: source
    jobs:
      - name: 代码源
        type: git_source

  - id: stg_test
    name: 代码测试
    kind: build
    needs: [stg_src]
    jobs:
      - name: Vue 3 测试
        type: script
        script:
          image: node:22-alpine
          commands:
            - corepack enable
            - pnpm install
            - pnpm run type-check:test
            - pnpm run test:unit

  - id: stg_build_push
    name: 镜像构建与推送
    kind: build
    needs: [stg_test]
    jobs:
      - id: job_build_image
        name: 构建镜像
        type: build_image
        config:
          buildModel: dockerfile
          dockerfilePath: Dockerfile
          context: .
          artifactType: image
      - id: job_push_image
        name: 推送镜像
        type: push_image
        config:
          registry: registry.xuzuxing.cn/beaconix
          imageName: beaconix-web
          tag: '${COMMIT_SHA}'

  - id: stg_deploy
    name: 应用部署
    kind: deploy
    needs: [stg_build_push]
    jobs:
      - name: 计算镜像 tag
        type: script
        script:
          image: alpine/git:latest
          commands:
            - 'echo "IMAGE_TAG=$(git rev-parse HEAD | cut -c1-7)" >> "$PIPEWRIGHT_ENV"'
      - name: 更新应用镜像
        type: script
        script:
          image: bitnami/kubectl:latest
          commands:
            - kubectl set image deployment/beaconix-web web=registry.xuzuxing.cn/beaconix/beaconix-web:${IMAGE_TAG} -n beaconix
            - kubectl rollout status deployment/beaconix-web -n beaconix --timeout=120s

  - id: stg_check
    name: 通知
    kind: notify
    needs: [stg_deploy]
    jobs:
      - name: 健康门控
        type: health_check
        config:
          expectStatus: '200'
          intervalSeconds: '30'
          retries: '5'
          url: http://127.0.0.1/
      - name: 通知
        type: notify
        config:
          channel: f448eace-cd6f-4455-9d68-ac9239b867d7
