# 1. 部署业务应用 (Deployment)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beaconix-web
  namespace: beaconix
  labels:
    app.kubernetes.io/name: beaconix
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: beaconix
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: beaconix
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beaconix
        app.kubernetes.io/component: web
    spec:
      # 【核心】强制调度到带有 prod 标签的 Worker 节点
      nodeSelector:
        node-role: prod
      # 容器配置
      containers:
        - name: web
          image: registry.xuzuxing.cn/beaconix/beaconix-web:latest
          imagePullPolicy: IfNotPresent
          # 【必填】nginx.conf 里的 proxy_pass ${BACKEND_ORIGIN} 由容器启动时的
          # 使用集群内真实的后端 Service 名与端口。
          env:
            - name: BACKEND_ORIGIN
              value: 'http://beaconix-app.beaconix.svc.cluster.local:3000'
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # 【核心】给 Pod 分配合理的资源，防止单个应用把 4G 的 Worker 内存打爆
          resources:
            requests:
              memory: '64Mi'
              cpu: '50m'
            limits:
              memory: '256Mi'
              cpu: '200m'
          # 健康检查：确保 Nginx 真正启动后才接入流量
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
# 2. 业务内部服务 (Service)
apiVersion: v1
kind: Service
metadata:
  name: beaconix-web-svc
  namespace: beaconix
  labels:
    app.kubernetes.io/name: beaconix
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: beaconix
spec:
  selector:
    app.kubernetes.io/name: beaconix
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
