# ============================================================
# Beaconix Web 站点配置（server 块，供 nginx http 块 include）
#
# 两种使用方式：
# 1. Docker：Dockerfile 会把本文件拷到 /etc/nginx/templates/default.conf.template，
#    容器启动时用 envsubst 把 ${BACKEND_ORIGIN} 渲染成真实后端地址
#    （由 docker run -e BACKEND_ORIGIN=... 指定）。
# 2. 裸机 / 已有 nginx：放到 /etc/nginx/conf.d/default.conf，
#    并把下面的 ${BACKEND_ORIGIN} 手动替换成后端地址（如 http://127.0.0.1:9000）。
# ============================================================

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # 静态资源目录（Docker 中由 Dockerfile 拷入 dist）
    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # 请求体上限，按后端上传限制调整
    client_max_body_size 20m;
    server_tokens        off;

    # ---- gzip ----
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/javascript
                    application/javascript application/json application/xml
                    image/svg+xml font/ttf font/otf;

    # ---- 安全响应头 ----
    # 注意 nginx 的 add_header 不会被子级 location 继承（子级一旦自己写了 add_header 就整体覆盖），
    # 因此下面凡是自带 add_header 的 location 都重复声明了这几个头。
    add_header X-Content-Type-Options nosniff                    always;
    add_header X-Frame-Options        SAMEORIGIN                 always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # ---- 接口反向代理 ----
    # 前端 VITE_API_BASE_URL=/api，后端接口路径本身带 /api 前缀，
    # 所以这里按原样转发、不做路径改写（与 vite dev 代理最终效果一致）。
    # 注意 BACKEND_ORIGIN 只写协议 + 主机 + 端口，不要带结尾斜杠或额外路径。
    location /api/ {
        proxy_pass ${BACKEND_ORIGIN};

        proxy_http_version 1.1;

        # 上游是 HTTPS（如 https://beaconix.app）时必须发送 SNI，
        # 否则 Cloudflare / 多站点网关拿不到域名，TLS 握手直接失败 → nginx 报 502。
        proxy_ssl_server_name on;
        proxy_ssl_name        $proxy_host;

        # Host 用上游主机名：反代到域名时即该域名（Cloudflare 按 Host 判断回源站点），
        # 反代到内网 IP / 容器名时即 "ip:port"。
        # 后端若要求固定 Host，把下一行改成具体域名即可。
        proxy_set_header Host              $proxy_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 便于 SSE / 流式响应，同时避免代理层缓存接口数据
        proxy_buffering off;
        proxy_cache     off;

        # 需要 WebSocket 时，在 http 块中定义
        #   map $http_upgrade $connection_upgrade { default upgrade; '' close; }
        # 再把下面两行打开：
        # proxy_set_header Upgrade    $http_upgrade;
        # proxy_set_header Connection $connection_upgrade;
    }

    # ---- 带 hash 的构建产物：长缓存 ----
    # ^~ 让该前缀优先于下面的扩展名正则，避免 svg/字体等被正则规则覆盖
    location ^~ /assets/ {
        expires    1y;
        access_log off;
        try_files  $uri =404;
    }

    # ---- 入口 HTML：不缓存，保证发版后立刻拿到新的资源引用 ----
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff                    always;
        add_header X-Frame-Options        SAMEORIGIN                 always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
    }

    # ---- SPA 路由回退：vue-router history 模式 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 其余静态资源默认缓存一天
    location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|otf)$ {
        expires 7d;
        access_log off;
    }

    # 隐藏文件与备份文件不对外提供
    location ~ /\.(?!well-known) {
        deny all;
    }
}
